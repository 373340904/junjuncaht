<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JunjunChat</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<!-- 登录 -->
<div id="login-panel" class="login-panel">
  <div class="glass-card login-card">
    <div class="login-logo">
      <div class="logo-icon"><img src="logo.png" alt=""></div>
      <h1 class="app-title">JunjunChat</h1>
      <p class="app-subtitle">随时随地，你我都在</p>
    </div>
    <div id="login-form">
      <input id="li-user" type="text" placeholder="用户名" class="glass-input">
      <input id="li-pass" type="password" placeholder="密码" class="glass-input">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer;margin:2px 0 10px">
        <input type="checkbox" id="li-remember" style="width:14px;height:14px;cursor:pointer">
        下次自动登录
      </label>
      <button id="li-btn" class="glass-btn primary">登 录</button>
      <div class="login-footer"><span id="to-reg">注册账号</span></div>
    </div>
    <div id="reg-form" style="display:none">
      <input id="re-user" type="text" placeholder="用户名" class="glass-input">
      <input id="re-nick" type="text" placeholder="昵称（可选）" class="glass-input">
      <input id="re-pass" type="password" placeholder="密码（至少6位）" class="glass-input">
      <input id="re-pass2" type="password" placeholder="确认密码" class="glass-input">
      <button id="re-btn" class="glass-btn primary">注 册</button>
      <div class="login-footer"><span id="to-login">返回登录</span></div>
    </div>
    <div id="li-msg" class="error-msg"></div>
    <div style="text-align:center;margin-top:8px"><span style="font-size:11px;color:var(--text-3);cursor:pointer;text-decoration:underline" onclick="localStorage.clear();location.reload()">清除本地缓存</span></div>
  </div>
</div>

<!-- 主界面 -->
<div id="main-app" style="display:none">
  <!-- 左侧导航 -->
  <div class="sidebar">
    <div class="sidebar-avatar" id="sidebar-avatar">?</div>
    <div class="nav-item active" data-nav="chat" title="消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
    <div class="nav-item" data-nav="contacts" title="联系人"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
    <div class="nav-item" data-nav="space" title="动态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
    <div class="nav-item" data-nav="bots" title="机器人"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg></div>
    <div style="flex:1"></div>
    <div class="nav-item" id="theme-toggle" title="主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div>
    <div class="nav-item" data-nav="settings" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
  </div>

  <!-- 主内容 -->
  <div class="main-content">
    <!-- 聊天页 -->
    <div class="chat-layout" id="layout-chat">
      <div class="list-panel">
        <div class="panel-header">
          <span class="panel-title">消息</span>
          <button class="icon-btn" id="btn-add-chat" title="发起聊天">+</button>
        </div>
        <div class="search-box"><input id="search-input" type="text" placeholder="搜索"></div>
        <div class="list-container" id="chat-list"></div>
      </div>
      <div class="chat-area" id="chat-area">
        <div class="chat-header">
          <div style="display:flex;align-items:center;gap:10px;cursor:pointer" id="chat-title-area">
            <span id="chat-title">选择会话</span>
          </div>
          <button class="icon-btn" id="btn-group-menu" title="更多" style="display:none">⋯</button>
        </div>
        <div class="group-announcement" id="group-announcement" style="display:none"></div>
        <div class="messages-container" id="messages-container">
          <div class="empty-state"><div class="empty-icon">💬</div><p>选择一个会话开始聊天</p></div>
        </div>
        <div class="input-area">
          <div class="emoji-panel" id="emoji-panel" style="display:none"></div>
          <div class="input-toolbar">
            <button class="icon-btn" id="btn-emoji" title="表情">😊</button>
          </div>
          <div class="input-wrapper">
            <textarea id="message-input" placeholder="输入消息，Enter发送"></textarea>
            <button id="btn-send" class="send-btn">发送</button>
          </div>
        </div>
      </div>
      <!-- 群信息侧边栏 -->
      <div class="group-sidebar" id="group-sidebar" style="display:none">
        <div class="gs-header">
          <span>群信息</span>
          <button class="icon-btn" id="btn-close-gs">×</button>
        </div>
        <div class="gs-content" id="gs-content"></div>
      </div>
    </div>

    <!-- 联系人页 -->
    <div class="page-layout" id="layout-contacts" style="display:none">
      <div class="page-header"><span class="panel-title">联系人</span><button class="icon-btn" id="btn-add-friend">+</button></div>
      <div class="page-content-wide" id="contacts-content"></div>
    </div>

    <!-- 动态页 -->
    <div class="page-layout" id="layout-space" style="display:none">
      <div class="page-header"><span class="panel-title">好友动态</span><button class="icon-btn" id="btn-post-moment">✏️</button></div>
      <div class="page-content-wide" id="space-container"></div>
    </div>

    <!-- 机器人页 -->
    <div class="page-layout" id="layout-bots" style="display:none">
      <div class="page-header"><span class="panel-title">机器人</span><button class="icon-btn" id="btn-create-bot">+</button></div>
      <div class="page-content-wide" id="bots-content"></div>
    </div>

    <!-- 设置页 -->
    <div class="page-layout" id="layout-settings" style="display:none">
      <div class="page-header"><span class="panel-title">设置</span></div>
      <div class="page-content-wide"><div class="settings-container" id="settings-content"></div></div>
    </div>
  </div>
</div>

<!-- 右键菜单 -->
<div id="context-menu" class="context-menu" style="display:none"></div>

<!-- 用户名片 -->
<div id="user-card" class="user-card-modal" style="display:none">
  <div class="user-card glass-card" id="user-card-content"></div>
</div>

<!-- 群菜单弹窗 -->
<div id="group-menu-popup" class="popup-menu" style="display:none"></div>

<!-- 通用弹窗 -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-content glass-card">
    <div class="modal-header"><span id="modal-title">标题</span><button class="icon-btn" id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer"><button class="glass-btn" id="modal-cancel">取消</button><button class="glass-btn primary" id="modal-ok">确定</button></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
