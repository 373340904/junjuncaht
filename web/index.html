<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JunjunChat</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<!-- 登录 -->
<div id="login-panel" class="login-panel">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><img src="logo.png" alt=""></div>
      <h1 class="app-title">JunjunChat</h1>
      <p class="app-subtitle">随时随地，你我都在</p>
    </div>
    <div id="login-form">
      <input id="li-user" type="text" placeholder="用户名" class="glass-input">
      <input id="li-pass" type="password" placeholder="密码" class="glass-input">
      <label class="remember-label"><input type="checkbox" id="li-remember"> 下次自动登录</label>
      <button id="li-btn" class="primary-btn">登 录</button>
      <div class="login-footer"><span id="to-reg">注册账号</span></div>
    </div>
    <div id="reg-form" style="display:none">
      <input id="re-user" type="text" placeholder="用户名" class="glass-input">
      <input id="re-nick" type="text" placeholder="昵称（可选）" class="glass-input">
      <input id="re-pass" type="password" placeholder="密码（至少6位）" class="glass-input">
      <input id="re-pass2" type="password" placeholder="确认密码" class="glass-input">
      <button id="re-btn" class="primary-btn">注 册</button>
      <div class="login-footer"><span id="to-login">返回登录</span></div>
    </div>
    <div id="li-msg" class="error-msg"></div>
  </div>
</div>

<!-- 主界面 - KukeChat三栏布局 56px+252px+1fr -->
<div id="main-app" style="display:none">
  <!-- 左侧导航 56px -->
  <div class="kc-rail">
    <div class="kc-rail-top">
      <div class="kc-rail-item active" data-nav="chat" title="聊天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="kc-rail-badge" id="unread-badge" style="display:none">0</span></div>
      <div class="kc-rail-item" data-nav="teamup" title="组队中心"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="kc-rail-item" data-nav="posts" title="动态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <div class="kc-rail-item" data-nav="contacts" title="联系人"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="kc-rail-item" data-nav="bots" title="机器人"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg></div>
      <div class="kc-rail-item" data-nav="home" title="主页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div class="kc-rail-item" id="btn-create-group" title="创建群聊"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
    </div>
    <div class="kc-rail-bottom">
      <div class="kc-rail-item" data-nav="tasks" title="任务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
      <div class="kc-rail-item" data-nav="favorites" title="收藏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
      <div class="kc-rail-item" id="btn-announcement" title="公告"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
      <div class="kc-rail-item" data-nav="settings" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <div class="kc-rail-avatar" id="sidebar-avatar" title="个人资料">?</div>
    </div>
  </div>

  <!-- 中间列表 252px -->
  <div class="kc-list-panel" id="list-panel">
    <div class="kc-list-header">
      <span class="kc-list-title" id="list-title">消息</span>
      <button class="kc-icon-btn" id="btn-list-add" title="添加">+</button>
    </div>
    <div class="kc-search-box"><input id="search-input" type="text" placeholder="搜索"></div>
    <div class="kc-list-container" id="list-container"></div>
  </div>

  <!-- 右侧内容 -->
  <div class="kc-content">
    <!-- 聊天页 -->
    <div class="kc-view" id="view-chat">
      <div class="kc-chat-header">
        <span id="chat-title">选择会话</span>
        <button class="kc-icon-btn" id="btn-group-menu" title="更多" style="display:none">⋯</button>
      </div>
      <div class="kc-announcement" id="group-announcement" style="display:none"></div>
      <div class="kc-messages" id="messages-container">
        <div class="empty-state"><div class="empty-icon">💬</div><p>选择一个会话开始聊天</p></div>
      </div>
      <div class="kc-input-area">
        <div class="emoji-panel" id="emoji-panel" style="display:none"></div>
        <div class="kc-input-toolbar">
          <button class="kc-icon-btn" id="btn-emoji" title="表情">😊</button>
        </div>
        <div class="kc-input-wrapper">
          <textarea id="message-input" placeholder="输入消息，Enter发送，支持Markdown"></textarea>
          <button id="btn-send" class="kc-send-btn">发送</button>
        </div>
      </div>
    </div>
    <!-- 群信息侧边栏 -->
    <div class="kc-group-sidebar" id="group-sidebar" style="display:none">
      <div class="kc-gs-header"><span>群信息</span><button class="kc-icon-btn" id="btn-close-gs">×</button></div>
      <div class="kc-gs-content" id="gs-content"></div>
    </div>

    <!-- 其他页面 -->
    <div class="kc-view" id="view-contacts" style="display:none"><div class="kc-page-header"><span class="kc-list-title">联系人</span></div><div class="kc-page-content" id="contacts-content"></div></div>
    <div class="kc-view" id="view-posts" style="display:none"><div class="kc-page-header"><span class="kc-list-title">动态</span><button class="kc-icon-btn" id="btn-post-moment">✏️</button></div><div class="kc-page-content" id="space-container"></div></div>
    <div class="kc-view" id="view-bots" style="display:none"><div class="kc-page-header"><span class="kc-list-title">机器人广场</span><button class="kc-icon-btn" id="btn-create-bot">+</button></div><div class="kc-page-content"><div class="bot-stats" id="bot-stats"></div><div class="bot-grid" id="bots-content"></div></div></div>
    <div class="kc-view" id="view-home" style="display:none"><div class="kc-page-header"><span class="kc-list-title">主页</span></div><div class="kc-page-content" id="home-content"></div></div>
    <div class="kc-view" id="view-teamup" style="display:none"><div class="kc-page-header"><span class="kc-list-title">组队中心</span></div><div class="kc-page-content" id="teamup-content"></div></div>
    <div class="kc-view" id="view-tasks" style="display:none"><div class="kc-page-header"><span class="kc-list-title">任务</span><button class="kc-icon-btn" id="btn-add-task">+</button></div><div class="kc-page-content" id="tasks-content"></div></div>
    <div class="kc-view" id="view-favorites" style="display:none"><div class="kc-page-header"><span class="kc-list-title">收藏</span></div><div class="kc-page-content" id="favorites-content"></div></div>
    <div class="kc-view" id="view-settings" style="display:none"><div class="kc-page-header"><span class="kc-list-title">设置</span></div><div class="kc-page-content"><div class="settings-container" id="settings-content"></div></div></div>
  </div>
</div>

<!-- 右键菜单 -->
<div id="context-menu" class="context-menu" style="display:none"></div>
<!-- 用户名片 -->
<div id="user-card" class="user-card-modal" style="display:none"><div class="user-card glass-card" id="user-card-content"></div></div>
<!-- 群菜单弹窗 -->
<div id="group-menu-popup" class="popup-menu" style="display:none"></div>
<!-- 通用弹窗 -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-content glass-card">
    <div class="modal-header"><span id="modal-title">标题</span><button class="kc-icon-btn" id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer"><button class="glass-btn" id="modal-cancel">取消</button><button class="glass-btn primary" id="modal-ok">确定</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
